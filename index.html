<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모두의 AI 예산 심의</title>
  <meta name="description" content="국회가 심사하는 AI 예산, 시민도 직접 나눠 보고 따져 봅니다.">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header class="intro">
    <p class="eyebrow">2027년 정부안 · 국회 심사 중</p>
    <h1>모두의 AI 예산 <span class="stamp">심의</span></h1>
    <p class="tagline">국회가 심사하는 AI 예산, 시민도 직접 나눠 보고 따져 봅니다.</p>
    <p>과학기술정보통신부의 2027년 AI 예산 정부안을 15개 분야로 나눴습니다. 금액을 내 생각대로 조절해 보고, 정부안에 없는 '민주적 AI 거버넌스' 칸도 채워 보세요. 내가 짠 예산은 링크로 나눌 수 있습니다.</p>

    <figure class="waffle-figure">
      <figcaption id="waffle-caption"></figcaption>
      <div class="waffle" id="waffle" role="img"></div>
      <ul class="legend" id="legend" aria-label="분야별 색과 칸 수"></ul>
    </figure>

    <a class="start" href="#groups">내 예산 짜러 가기 ↓</a>
    <div class="facts" id="facts"></div>
  </header>

  <section class="summary" aria-label="합계">
    <dl>
      <div><dt>정부안</dt><dd id="total-gov">-</dd></div>
      <div><dt>내 예산</dt><dd id="total-mine">-</dd></div>
      <div><dt>차이</dt><dd id="total-diff">-</dd></div>
    </dl>
    <div class="bars" aria-hidden="true">
      <div class="bar-row"><span class="bar-label">정부안</span><div class="track"><div class="fill" id="bar-gov"></div></div></div>
      <div class="bar-row"><span class="bar-label">내 예산</span><div class="track"><div class="fill" id="bar-mine"></div></div></div>
    </div>
    <p class="highlights" id="highlights"></p>
    <div class="actions">
      <button type="button" id="share">링크 복사</button>
      <button type="button" id="reset" class="secondary">처음으로</button>
    </div>
    <p class="share-status" id="share-status" role="status"></p>
  </section>

  <main id="groups">
    <p class="status">예산 항목을 불러오고 있습니다.</p>
  </main>

  <footer id="source"></footer>

  <div class="tip" id="tip" role="tooltip" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
