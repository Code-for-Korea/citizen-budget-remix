<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>의견 · 모두의 AI 예산 심의</title>
  <meta name="description" content="시민이 남긴 예산안에 대한 의견입니다. 예산안 전체, 대분류, 분야마다 남길 수 있습니다. 글을 누르면 자세히 볼 수 있습니다.">
  <link rel="stylesheet" href="../src/style.css">
</head>
<body>
  <nav class="site-nav" aria-label="사이트 메뉴">
    <a href="../">홈</a>
    <a href="../opinions/" aria-current="page">의견</a>
    <a href="../proposals/">시민 예산안</a>
  </nav>

  <main class="board page">
    <h1>의견 <span class="count" data-count="question"></span></h1>
    <p class="board-intro">시민이 남긴 예산안에 대한 의견입니다. 예산안 전체, 대분류, 분야마다 남길 수 있습니다. 글을 누르면 자세히 볼 수 있습니다.</p>

    <section class="board-list" data-board-list data-kind="question" aria-label="의견 목록">
      <div class="board-bar">
        <label class="filter">보기 <select data-filter><option value="all">모든 의견</option></select></label>
        <button type="button" data-write="question" data-target="">의견 남기기</button>
      </div>
      <p class="status board-status" role="status"></p>
      <ol class="posts"></ol>
    </section>
  </main>

  <script type="module" src="../src/posts.js"></script>
</body>
</html>
