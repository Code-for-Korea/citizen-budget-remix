<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>심의 · 모두의 AI 예산 심의</title>
  <meta name="description" content="예산안 전체, 대분류, 분야마다 시민이 남긴 질문·제안입니다.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../src/style.css?v=202610240124">
</head>
<body>
  <nav class="site-nav" aria-label="사이트 메뉴">
    <a href="../">예산안 짜기</a>
    <a href="../budgets/">시민 예산안</a>
    <a href="../deliberation/" aria-current="page">심의</a>
  </nav>

  <main class="board page">
    <h1>심의 <span class="count" data-count="talk"></span></h1>
    <p class="board-intro">예산안 전체, 대분류, 분야마다 시민이 남긴 질문·제안입니다. 제안은 대분류나 분야 하나를 얼마나 늘리거나 줄이자는 글이고, 「내 예산안에 반영」을 누르면 홈에서 내 예산에 그대로 옮겨집니다.</p>

    <section class="board-list" data-board-list data-kind="talk" aria-label="질문·제안 목록">
      <div class="board-bar">
        <div class="filters">
          <label class="filter">종류 <select data-kind-filter>
            <option value="all">모두</option>
            <option value="question">질문</option>
            <option value="proposal">제안</option>
          </select></label>
          <label class="filter">대상 <select data-filter><option value="all">모든 대상</option></select></label>
        </div>
        <button type="button" data-write="" data-target="">남기기</button>
      </div>
      <p class="status board-status" role="status"></p>
      <ol class="posts"></ol>
    </section>
  </main>

  <script type="module" src="../src/posts.js?v=202610240124"></script>
</body>
</html>
